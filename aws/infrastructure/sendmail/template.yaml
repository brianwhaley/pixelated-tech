AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Existing sendmail API and form submission persistence.

Parameters:
  CreateExecutionRole:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  ExecutionRoleName:
    Type: String
    Default: sendmail_execution_role
  ExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::971579260814:role/service-role/sendmail_execution_role
  BucketName:
    Type: String
    Default: pixelated-sendmail-bucket
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:971579260814:certificate/fcbcbe4a-0a02-4fe4-9ab3-c412da614f0d
  AlarmTopicArn:
    Type: String
    Default: arn:aws:sns:us-east-1:971579260814:pixelated-cloudwatch-alarms
  SmtpUser:
    Type: String
    Default: ''
  SmtpPassword:
    Type: String
    NoEcho: true
    Default: ''

Conditions:
  CreateExecutionRoleCondition: !Equals [!Ref CreateExecutionRole, 'true']
  ConfigureSmtp: !And
    - !Not [!Equals [!Ref SmtpUser, '']]
    - !Not [!Equals [!Ref SmtpPassword, '']]

Resources:
  SendmailExecutionRole:
    Condition: CreateExecutionRoleCondition
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Ref ExecutionRoleName
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  FormSubmissionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: PixelatedFormSubmissionsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: domain
          AttributeType: S
        - AttributeName: submissionId
          AttributeType: S
      KeySchema:
        - AttributeName: domain
          KeyType: HASH
        - AttributeName: submissionId
          KeyType: RANGE

  SendmailFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: sendmail
      CodeUri: ../../services/sendmail/
      Handler: src/index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 10
      Role: !If [CreateExecutionRoleCondition, !GetAtt SendmailExecutionRole.Arn, !Ref ExecutionRoleArn]
      Environment: !If
        - ConfigureSmtp
        - Variables:
            SMTP_USER: !Ref SmtpUser
            SMTP_PASSWORD: !Ref SmtpPassword
        - !Ref AWS::NoValue

  SendmailApi:
    Type: AWS::ApiGateway::RestApi
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: sendmail
      EndpointConfiguration:
        Types:
          - REGIONAL

  SendmailApiResource:
    Type: AWS::ApiGateway::Resource
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ParentId: !GetAtt SendmailApi.RootResourceId
      PathPart: sendmail-lambda
      RestApiId: !Ref SendmailApi

  SendmailApiMethod:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: ANY
      Integration:
        IntegrationHttpMethod: POST
        IntegrationResponses:
          - ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{"message":"Forbidden"}'
            StatusCode: '403'
        RequestTemplates:
          application/json: '{"statusCode":403}'
        Type: MOCK
      MethodResponses:
        - ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
          StatusCode: '403'
      ResourceId: !Ref SendmailApiResource
      RestApiId: !Ref SendmailApi

  SendmailApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      Integration:
        IntegrationResponses:
          - ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            StatusCode: '200'
        IntegrationHttpMethod: POST
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        Type: MOCK
      MethodResponses:
        - ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false
          StatusCode: '200'
      ResourceId: !Ref SendmailApiResource
      RestApiId: !Ref SendmailApi

  SendmailS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - SendmailS3InvokePermission
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSendmailMessages
            Status: Enabled
            ExpirationInDays: 30
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt SendmailS3Function.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: ''

  SendmailS3Function:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: sendmail-s3
      CodeUri: ../../services/sendmail-s3/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 30
      Role: !If [CreateExecutionRoleCondition, !GetAtt SendmailExecutionRole.Arn, !Ref ExecutionRoleArn]
      LoggingConfig:
        LogGroup: !Ref SendmailLogGroup
      Environment: !If
        - ConfigureSmtp
        - Variables:
            S3_BUCKET: !Ref BucketName
            SMTP_USER: !Ref SmtpUser
            SMTP_PASSWORD: !Ref SmtpPassword
        - Variables:
            S3_BUCKET: !Ref BucketName

  SendmailS3InvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SendmailS3Function
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:s3:::${BucketName}

  SendmailS3ApiResource:
    Type: AWS::ApiGateway::Resource
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ParentId: !GetAtt SendmailApi.RootResourceId
      PathPart: sendmail
      RestApiId: !Ref SendmailApi

  SendmailS3ApiMethod:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: POST
      Integration:
        Credentials: !If [CreateExecutionRoleCondition, !GetAtt SendmailExecutionRole.Arn, !Ref ExecutionRoleArn]
        IntegrationHttpMethod: PUT
        IntegrationResponses:
          - StatusCode: '200'
            SelectionPattern: '2\d{2}'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{"message":"accepted"}'
        PassthroughBehavior: WHEN_NO_TEMPLATES
        RequestParameters:
          integration.request.path.requestId: context.requestId
        RequestTemplates:
          application/json: $input.body
        Type: AWS
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${BucketName}/{requestId}.json
      MethodResponses:
        - ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
          StatusCode: '200'
      ResourceId: !Ref SendmailS3ApiResource
      RestApiId: !Ref SendmailApi

  SendmailS3ApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      Integration:
        IntegrationResponses:
          - ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            StatusCode: '200'
        IntegrationHttpMethod: POST
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        Type: MOCK
      MethodResponses:
        - ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false
          StatusCode: '200'
      ResourceId: !Ref SendmailS3ApiResource
      RestApiId: !Ref SendmailApi

  SendmailApiDeploymentV6:
    Type: AWS::ApiGateway::Deployment
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - SendmailApiMethod
      - SendmailApiOptionsMethod
      - SendmailS3ApiMethod
      - SendmailS3ApiOptionsMethod
    Properties:
      Description: Sendmail API deployment with S3 response mapping
      RestApiId: !Ref SendmailApi

  SendmailApiStage:
    Type: AWS::ApiGateway::Stage
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeploymentId: !Ref SendmailApiDeploymentV6
      RestApiId: !Ref SendmailApi
      StageName: default
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          MetricsEnabled: true
          LoggingLevel: INFO
          ThrottlingBurstLimit: 5000
          ThrottlingRateLimit: 10000
      AccessLogSetting:
        DestinationArn: !GetAtt SendmailApiAccessLogGroupV2.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationStatus":"$context.integration.status","integrationLatency":"$context.integration.latency"}

  SendmailApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - SendmailApiStage
    Properties:
      AlarmName: Pixelated Sendmail API 5XX Errors Alarm
      AlarmDescription: Alerts when the sendmail production API Gateway stage returns a server error.
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmTopicArn
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: sendmail
        - Name: Stage
          Value: default
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SendmailApiPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SendmailFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SendmailApi}/*/*/sendmail-lambda

  SendmailApiDomain:
    Type: AWS::ApiGateway::DomainName
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: sendmail.pixelated.tech
      EndpointConfiguration:
        Types:
          - REGIONAL
      RegionalCertificateArn: !Ref CertificateArn
      SecurityPolicy: TLS_1_2

  SendmailApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BasePath: default
      DomainName: !Ref SendmailApiDomain
      RestApiId: !Ref SendmailApi
      Stage: default

  SendmailApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/apigateway/sendmail/default
      RetentionInDays: 30

  SendmailApiAccessLogGroupV2:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/apigateway/sendmail/access
      RetentionInDays: 30

  SendmailLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/sendmail
      RetentionInDays: 30

  SendmailErrorsMetricFilter:
    Type: AWS::Logs::MetricFilter
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FilterPattern: '%ERROR|Error|error|FAILED|Failed|failed|Exception|exception|SMTP_USER|Bad Request|DynamoDB write failed|Internal server error|Task timed out|Runtime.ExitError%'
      LogGroupName: !Ref SendmailLogGroup
      MetricTransformations:
        - MetricName: Pixelated Sendmail Errors Metric
          MetricNamespace: Pixelated/Lambda
          MetricValue: '1'
          DefaultValue: 0

  SendmailErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AlarmName: Pixelated Sendmail Errors Alarm
      AlarmDescription: Alerts when the sendmail Lambda emits an application or runtime error.
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmTopicArn
      Namespace: Pixelated/Lambda
      MetricName: Pixelated Sendmail Errors Metric
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SendmailErrorsQuery:
    Type: AWS::Logs::QueryDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: Pixelated Sendmail Errors Query
      LogGroupNames:
        - !Ref SendmailLogGroup
      QueryString: |
        fields @timestamp, @message, @logStream
        | filter @message like /(?i)(smtp_user|bad request|dynamodb write failed|error starting asynchronous dynamodb write|sendmail lambda error|internal server error|task timed out|runtime\.exiterror)/
        | sort @timestamp desc
