AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Existing S3-triggered Rekognition custom-label Lambda.

Resources:
  FacialRecognitionExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: pixelated-facial-recognition-role-508d9e73
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonRekognitionFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/service-role/AmazonS3ObjectLambdaExecutionRolePolicy
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  FacialRecognitionFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: pixelated-facial-recognition
      CodeUri: ../../services/facial-recognition/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      Role: !GetAtt FacialRecognitionExecutionRole.Arn

  FacialRecognitionInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FacialRecognitionFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: arn:aws:s3:::pixelated-photos

  FacialRecognitionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/pixelated-facial-recognition
      RetentionInDays: 30

  FacialRecognitionErrorsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: '%ERROR|Error|error|FAILED|Failed|failed|Exception|exception|analyze image|unexpected state|Timeout waiting|Task timed out|Runtime.ExitError%'
      LogGroupName: !Ref FacialRecognitionLogGroup
      MetricTransformations:
        - MetricName: Pixelated Facial Recognition Errors Metric
          MetricNamespace: Pixelated/FacialRecognition
          MetricValue: '1'
          DefaultValue: 0

  FacialRecognitionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Pixelated Facial Recognition Errors Alarm
      AlarmDescription: Alerts when the facial-recognition Lambda emits an application or runtime error.
      ActionsEnabled: true
      AlarmActions:
        - arn:aws:sns:us-east-2:971579260814:CloudWatch_Alarms
      Namespace: Pixelated/FacialRecognition
      MetricName: Pixelated Facial Recognition Errors Metric
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FacialRecognitionErrorsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: Pixelated Facial Recognition Errors Query
      LogGroupNames:
        - !Ref FacialRecognitionLogGroup
      QueryString: |
        fields @timestamp, @message, @logStream
        | filter @message like /(?i)(error|failed|exception|couldn.t analyze image|unexpected state|timeout waiting|task timed out|runtime\.exiterror)/
        | sort @timestamp desc

  PixelatedPhotosBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - FacialRecognitionInvokePermission
    Properties:
      BucketName: pixelated-photos
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FacialRecognitionFunction.Arn

  CustomLabelsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: custom-labels-console-us-east-2-93cfc48e5c
