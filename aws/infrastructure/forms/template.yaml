AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Public form submission API, S3 buffering, processing, persistence, and SES delivery.

Parameters:
  ExecutionRoleName:
    Type: String
    Default: forms_execution_role
  BucketName:
    Type: String
    Default: pixelated-forms-bucket
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:971579260814:certificate/fcbcbe4a-0a02-4fe4-9ab3-c412da614f0d
  AlarmTopicArn:
    Type: String
    Default: arn:aws:sns:us-east-1:971579260814:pixelated-cloudwatch-alarms

Resources:
  FormsExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Ref ExecutionRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FormsProcessingAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}/*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PixelatedFormSubmissionsTable
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: '*'

  FormsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireFormSubmissions
            Status: Enabled
            ExpirationInDays: 30
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FormProcessingFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .json

  FormProcessingFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: form-processing
      CodeUri: ../../services/form-processing/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt FormsExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref BucketName
      LoggingConfig:
        LogGroup: !Ref FormProcessingLogGroup

  FormProcessingInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FormProcessingFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:s3:::${BucketName}

  FormsApi:
    Type: AWS::ApiGateway::RestApi
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: forms
      EndpointConfiguration:
        Types:
          - REGIONAL

  FormsApiResource:
    Type: AWS::ApiGateway::Resource
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ParentId: !GetAtt FormsApi.RootResourceId
      PathPart: forms
      RestApiId: !Ref FormsApi

  FormsApiMethod:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: POST
      Integration:
        Credentials: !GetAtt FormsExecutionRole.Arn
        IntegrationHttpMethod: PUT
        IntegrationResponses:
          - StatusCode: '200'
            SelectionPattern: '2\d{2}'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{"message":"accepted"}'
        PassthroughBehavior: WHEN_NO_TEMPLATES
        RequestParameters:
          integration.request.path.requestId: context.requestId
        RequestTemplates:
          application/json: $input.body
        Type: AWS
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${BucketName}/{requestId}.json
      MethodResponses:
        - StatusCode: '200'
          ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
      ResourceId: !Ref FormsApiResource
      RestApiId: !Ref FormsApi

  FormsApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      Integration:
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        IntegrationHttpMethod: POST
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        Type: MOCK
      MethodResponses:
        - StatusCode: '200'
          ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false
      ResourceId: !Ref FormsApiResource
      RestApiId: !Ref FormsApi

  FormsApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - FormsApiMethod
      - FormsApiOptionsMethod
    Properties:
      Description: Forms API submission endpoint
      RestApiId: !Ref FormsApi

  FormsApiStage:
    Type: AWS::ApiGateway::Stage
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeploymentId: !Ref FormsApiDeployment
      RestApiId: !Ref FormsApi
      StageName: default
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          MetricsEnabled: true
          LoggingLevel: INFO
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      AccessLogSetting:
        DestinationArn: !GetAtt FormsApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationStatus":"$context.integration.status","integrationLatency":"$context.integration.latency"}

  FormsApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - FormsApiStage
    Properties:
      AlarmName: Pixelated Forms API 5XX Errors Alarm
      AlarmDescription: Alerts when the forms production API Gateway stage returns a server error.
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmTopicArn
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: forms
        - Name: Stage
          Value: default
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FormsApiDomain:
    Type: AWS::ApiGateway::DomainName
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: forms.pixelated.tech
      EndpointConfiguration:
        Types:
          - REGIONAL
      RegionalCertificateArn: !Ref CertificateArn
      SecurityPolicy: TLS_1_2

  FormsApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - FormsApiStage
    Properties:
      BasePath: default
      DomainName: !Ref FormsApiDomain
      RestApiId: !Ref FormsApi
      Stage: default

  FormsApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/apigateway/forms/access
      RetentionInDays: 30

  FormProcessingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/form-processing
      RetentionInDays: 30

  FormProcessingErrorsMetricFilter:
    Type: AWS::Logs::MetricFilter
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FilterPattern: '%ERROR|Error|error|FAILED|Failed|failed|Exception|exception|Bad Request|Internal server error|Confirmation email failed|S3 submission body cannot be empty|S3 event%'
      LogGroupName: !Ref FormProcessingLogGroup
      MetricTransformations:
        - MetricName: Pixelated Forms Errors Metric
          MetricNamespace: Pixelated/Lambda
          MetricValue: '1'

  FormProcessingErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AlarmName: Pixelated Forms Errors Alarm
      AlarmDescription: Alerts when the form-processing Lambda emits an application or runtime error.
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmTopicArn
      Namespace: Pixelated/Lambda
      MetricName: Pixelated Forms Errors Metric
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  FormsApiId:
    Value: !Ref FormsApi
  FormsApiRegionalDomainName:
    Value: !GetAtt FormsApiDomain.RegionalDomainName
  FormsBucketName:
    Value: !Ref FormsBucket
  FormProcessingFunctionName:
    Value: !Ref FormProcessingFunction
