AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Social publish intake and browser worker services.

Parameters:
  PixelatedConfigKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Key used to decrypt the canonical Pixelated config in the worker image.
  AlarmTopicArn:
    Type: String
    Default: arn:aws:sns:us-east-1:971579260814:pixelated-cloudwatch-alarms
  EcrRepositoryName:
    Type: String
    Default: pixelatedsocialpublishe53f5c95/socialpublishworkerbd7fee1arepo
  CodeBuildProjectName:
    Type: String
    Default: pixelated-social-publish-worker
  CodeBuildRoleName:
    Type: String
    Default: pixelated-social-publish-codebuild-role
  CodeBuildConnectionArn:
    Type: String
    Default: arn:aws:codestar-connections:us-east-1:971579260814:connection/af6c24c0-2882-43e5-9591-ec84f25f2419
  CodeBuildSourceCredentialsPolicyArn:
    Type: String
    Default: arn:aws:iam::971579260814:policy/service-role/CodeBuildCodeConnectionsSourceCredentialsPolicy-pixelated-social-publish-worker-us-east-1-971579260814
  CodeBuildLogRetentionInDays:
    Type: Number
    Default: 30

Resources:
  SocialPublishIntakeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: social-publish-intake-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeSocialPublishWorker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SocialPublishWorker.Arn

  SocialPublishWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: social-publish-worker-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  SocialPublishEcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref EcrRepositoryName

  SocialPublishCodeBuildRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Ref CodeBuildRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeBuildAdminAccess
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - !Ref CodeBuildSourceCredentialsPolicyArn

  SocialPublishCodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/codebuild/${CodeBuildProjectName}
      RetentionInDays: !Ref CodeBuildLogRetentionInDays

  SocialPublishCodeBuild:
    Type: AWS::CodeBuild::Project
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref CodeBuildProjectName
      ServiceRole: !GetAtt SocialPublishCodeBuildRole.Arn
      Source:
        Type: GITHUB
        Location: https://github.com/brianwhaley/pixelated-tech.git
        BuildSpec: aws/services/social-publish-worker/buildspec.yml
        Auth:
          Type: CODECONNECTIONS
          Resource: !Ref CodeBuildConnectionArn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY_NAME
            Value: !Ref EcrRepositoryName
          - Name: LAMBDA_FUNCTION_NAME
            Value: !Ref SocialPublishWorker
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref SocialPublishCodeBuildLogGroup
      Triggers:
        Webhook: true
        FilterGroups:
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: ^refs/heads/main$

  SocialPublishIntake:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: social-publish-intake
      CodeUri: ../../services/social-publish-intake/
      Handler: src/index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt SocialPublishIntakeRole.Arn

  SocialPublishWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: social-publish-worker
      PackageType: Image
      MemorySize: 1536
      Timeout: 300
      Architectures:
        - x86_64
      Role: !GetAtt SocialPublishWorkerRole.Arn
      Environment:
        Variables:
          PIXELATED_CONFIG_KEY: !Ref PixelatedConfigKey
    Metadata:
      Dockerfile: aws/services/social-publish-worker/Dockerfile
      DockerContext: ../../..
      DockerTag: config-path-fix-v3

  SocialPublishWorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Pixelated Social Publish Worker Errors Alarm
      AlarmDescription: Alerts when the social publish browser worker reports Lambda errors.
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmTopicArn
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SocialPublishWorker
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  SocialPublishIntakeFunctionArn:
    Value: !GetAtt SocialPublishIntake.Arn
  SocialPublishWorkerFunctionArn:
    Value: !GetAtt SocialPublishWorker.Arn
