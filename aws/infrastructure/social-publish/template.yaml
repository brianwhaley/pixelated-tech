AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Social publish intake and browser worker services.

Parameters:
  PixelatedConfigKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Key used to decrypt the canonical Pixelated config in the worker image.
  AlarmTopicArn:
    Type: String
    Default: arn:aws:sns:us-east-1:971579260814:pixelated-cloudwatch-alarms

Resources:
  SocialPublishIntakeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: social-publish-intake-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeSocialPublishWorker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SocialPublishWorker.Arn

  SocialPublishWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: social-publish-worker-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  SocialPublishIntake:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: social-publish-intake
      CodeUri: ../../services/social-publish-intake/
      Handler: src/index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt SocialPublishIntakeRole.Arn

  SocialPublishWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: social-publish-worker
      PackageType: Image
      MemorySize: 1536
      Timeout: 300
      Architectures:
        - x86_64
      Role: !GetAtt SocialPublishWorkerRole.Arn
      Environment:
        Variables:
          PIXELATED_CONFIG_KEY: !Ref PixelatedConfigKey
    Metadata:
      Dockerfile: aws/services/social-publish-worker/Dockerfile
      DockerContext: ../../..
      DockerTag: config-path-fix-v3

  SocialPublishWorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Pixelated Social Publish Worker Errors Alarm
      AlarmDescription: Alerts when the social publish browser worker reports Lambda errors.
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmTopicArn
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SocialPublishWorker
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  SocialPublishIntakeFunctionArn:
    Value: !GetAtt SocialPublishIntake.Arn
  SocialPublishWorkerFunctionArn:
    Value: !GetAtt SocialPublishWorker.Arn
