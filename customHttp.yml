applications:
  - appRoot: apps/pixelated
    customHeaders: &default_headers
      # RULES MATCH TOP TO BOTTOM
      # LATER RULES OVERRIDE EARLIER ONES
      # NON CONFLICTING HEADERS ARE PRESERVED
      - &rule-catchall
        pattern: "**/*"
        headers: &page_headers
          - key: "Cache-Control"
            value: "public, max-age=604800, s-maxage=31536000, stale-while-revalidate=86400"
      - &rule-static
        pattern: "/_next/static/**/*"
        headers: &static_headers
          - key: "Cache-Control"
            value: "public, max-age=31536000, s-maxage=31536000, immutable"
      - &rule-next-image
        pattern: "/_next/image/**/*"
        headers: &asset_headers
          - key: "Cache-Control"
            value: "public, max-age=2592000, s-maxage=31536000, stale-while-revalidate=604800"
      - &rule-images
        pattern: "/images/**/*"
        headers: *asset_headers
      - &rule-fonts
        pattern: "/fonts/**/*"
        headers: *asset_headers
      - &rule-videos
        pattern: "/videos/**/*"
        headers: *asset_headers

  - appRoot: apps/brianwhaley
    customHeaders:
      - *rule-catchall
      - *rule-static
      - *rule-next-image
      - *rule-images
      - *rule-fonts
      - *rule-videos
      # CUSTOM NO CACHE FOR BOOK DOWNLOAD PAGE FOR BRIANWHALEY
      # ALSO CREATES A REUSABLE REFERENCE FOR NO CACHE HEADERS
      - pattern: "/supermarketshenanigans/arc/download*"
        headers: &nocache_headers
          - key: "Cache-Control"
            value: "private, no-store, no-cache, max-age=0, s-maxage=0, must-revalidate"
          - key: "Pragma"
            value: "no-cache"
          - key: "Expires"
            value: "0"

  - appRoot: apps/amava-janitorial
    customHeaders:
      - *rule-catchall
      - *rule-static
      - *rule-next-image
      - *rule-images
      - *rule-fonts
      - *rule-videos
      # CUSTOM NO CACHE FOR TIMESHEETS PAGES
      - pattern: "/timesheets"
        headers: *nocache_headers
      - pattern: "/timesheets/"
        headers: *nocache_headers
      - pattern: "/timesheets/*"
        headers: *nocache_headers
      - pattern: "/timesheets/**/*"
        headers: *nocache_headers

  - appRoot: apps/gea-construction
    customHeaders: *default_headers

  - appRoot: apps/informationfocus
    customHeaders: *default_headers

  - appRoot: apps/jz-home-improvement
    customHeaders: *default_headers

  - appRoot: apps/manningmetalworks
    customHeaders: *default_headers

  - appRoot: apps/mgt-pro-services
    customHeaders: *default_headers

  - appRoot: apps/palmetto-epoxy
    customHeaders: *default_headers

  - appRoot: apps/pixelated-admin
    customHeaders:
      # CUSTOM NO CACHE FOR ALL PAGES IN PIXELATED ADMIN
      - pattern: "**/*"
        headers: *nocache_headers
      - *rule-static
      - *rule-next-image
      - *rule-images
      - *rule-fonts
      - *rule-videos
      # Covered by the no-cache catch-all
      # - pattern: "/api/auth/*" # *nocache_headers
      # - pattern: "/api/auth/**/*" # *nocache_headers
      # - pattern: "/login" # *nocache_headers
      # - pattern: "/login/*" # *nocache_headers

  - appRoot: packages/pixelated-components
    customHeaders: *default_headers

  - appRoot: apps/pixelvivid
    customHeaders: *default_headers

  - appRoot: apps/simple-day-concierge
    customHeaders: *default_headers

  - appRoot: apps/threemuses
    customHeaders:
      - *rule-catchall
      - *rule-static
      - *rule-next-image
      - *rule-images
      - *rule-fonts
      - *rule-videos
      # CUSTOM NO CACHE FOR EVENTS REPORT PAGES
      - pattern: "/events/report"
        headers: *nocache_headers
      - pattern: "/events/report/"
        headers: *nocache_headers
      - pattern: "/events/report/*"
        headers: *nocache_headers
      - pattern: "/events/report*"
        headers: *nocache_headers
