version: 1

applications:

  - appRoot: apps/amava-janitorial
    frontend: &shared_frontend
      phases:
        preBuild:
          commands:
            - 'echo "Installing dependencies for monorepo: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'cd ../../ && pwd'
            - 'npm install --force'
        build:
          commands:
            - 'echo "Building shared components: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w packages/pixelated-components'
            - 'echo "Decrypting config: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run config:decrypt -w $AMPLIFY_MONOREPO_APP_ROOT'
            - 'echo "Building Next.js app: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w $AMPLIFY_MONOREPO_APP_ROOT'
            # 'npm run generate-site-images -w $AMPLIFY_MONOREPO_APP_ROOT'
        postBuild:
          commands:
            - 'echo "Calling Config Vault postbuild ..."'
            - 'npm run config:postbuild -w $AMPLIFY_MONOREPO_APP_ROOT'
            - 'echo "Creating deployment artifact without Next.js cache..."'
            - 'rm -rf "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy"'
            - 'mkdir -p "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy"'
            - 'cp -R "$AMPLIFY_MONOREPO_APP_ROOT/.next/." "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy/"'
            - 'rm -rf "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy/cache"'
            - 'echo "===== Amplify artifact diagnostics ====="'
            - 'echo "Working directory: $(pwd)"'
            - 'echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Original Next output size:"'
            - 'du -sh "$AMPLIFY_MONOREPO_APP_ROOT/.next"'
            - 'echo "Staged artifact size:"'
            - 'du -sh "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy"'
            - 'echo "Original Next output top-level sizes:"'
            - 'du -sh "$AMPLIFY_MONOREPO_APP_ROOT/.next"/*'
            - 'echo "Staged artifact top-level sizes:"'
            - 'du -sh "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy"/*'
            - 'if [ -d "$AMPLIFY_MONOREPO_APP_ROOT/.next/cache" ]; then echo "Original cache: PRESENT"; du -sh "$AMPLIFY_MONOREPO_APP_ROOT/.next/cache"; else echo "Original cache: ABSENT"; fi'
            - 'if [ -d "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy/cache" ]; then echo "Staged cache: PRESENT (unexpected)"; du -sh "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy/cache"; else echo "Staged cache: ABSENT (expected)"; fi'
            - 'echo "Files larger than 10 MB in original Next output:"'
            - 'find "$AMPLIFY_MONOREPO_APP_ROOT/.next" -type f -size +10M -exec du -h {} \;'
            - 'echo "Files larger than 10 MB in staged artifact:"'
            - 'find "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy" -type f -size +10M -exec du -h {} \;'
            - 'echo "Staged artifact entries (depth 2):"'
            - 'find "$AMPLIFY_MONOREPO_APP_ROOT/.next-deploy" -maxdepth 2 -print'
            - 'echo "===== End Amplify artifact diagnostics ====="'
      artifacts:
        baseDirectory: .next-deploy
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .next/static/**/*
          - node_modules/**/*

  - appRoot: apps/brianwhaley
    frontend: *shared_frontend

  - appRoot: apps/informationfocus
    frontend: *shared_frontend

  - appRoot: apps/gea-construction
    frontend: *shared_frontend

  - appRoot: apps/jz-home-improvement
    frontend: *shared_frontend

  - appRoot: apps/manningmetalworks
    frontend: *shared_frontend

  - appRoot: apps/oaktreelandscaping
    frontend: *shared_frontend

  - appRoot: apps/palmetto-epoxy
    frontend: *shared_frontend

  - appRoot: apps/pixelated
    frontend: *shared_frontend

  - appRoot: apps/pixelated-admin
    frontend: *shared_frontend

  - appRoot: packages/pixelated-components
    frontend:
      phases:
        preBuild:
          commands:
            - 'echo "Installing dependencies for monorepo: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'cd ../../ && pwd'
            - 'npm install --force'
        build:
          commands:
            - 'echo "Building shared components: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w packages/pixelated-components'
            - 'echo "Decrypting config: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run config:decrypt -w $AMPLIFY_MONOREPO_APP_ROOT'
            - 'echo "Building Next.js app: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w $AMPLIFY_MONOREPO_APP_ROOT'
            # npm run generate-site-images -w $AMPLIFY_MONOREPO_APP_ROOT
            # BUILD STORYBOOK WITH EXTRA MEMORY TO AVOID CI OOM
            - 'echo "Building Storybook with extra memory to avoid CI OOM ..."'
            - 'NODE_OPTIONS=--max-old-space-size=8192 npm run buildStorybook -w $AMPLIFY_MONOREPO_APP_ROOT'
        postBuild:
          commands:
            - 'echo "Calling Config Vault postbuild ..."'
            - 'npm run config:postbuild -w $AMPLIFY_MONOREPO_APP_ROOT'
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
          - '!cache/**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .next/static/**/*
          - node_modules/**/*

  - appRoot: apps/pixelvivid
    frontend: *shared_frontend

  - appRoot: apps/simple-day-concierge
    frontend: *shared_frontend

  - appRoot: apps/threemuses
    frontend: *shared_frontend