version: 1

applications:

  - appRoot: apps/amava-janitorial
    frontend: &shared_frontend
      phases:
        preBuild:
          commands:
            - 'echo "Installing dependencies for monorepo: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'cd ../../ && pwd'
            - 'npm install --force'
        build:
          commands:
            - 'echo "Building shared components: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w packages/pixelated-components'
            - 'echo "Decrypting config: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run config:decrypt -w $AMPLIFY_MONOREPO_APP_ROOT'
            - 'echo "Building Next.js app: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w $AMPLIFY_MONOREPO_APP_ROOT'
            # 'npm run generate-site-images -w $AMPLIFY_MONOREPO_APP_ROOT'
        postBuild:
          commands:
            - 'echo "Calling Config Vault postbuild ..."'
            - 'npm run config:postbuild -w $AMPLIFY_MONOREPO_APP_ROOT'
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .next/static/**/*
          - node_modules/**/*

  - appRoot: apps/brianwhaley
    frontend: *shared_frontend

  - appRoot: apps/informationfocus
    frontend: *shared_frontend

  - appRoot: apps/gea-construction
    frontend: *shared_frontend

  - appRoot: apps/jz-home-improvement
    frontend: *shared_frontend

  - appRoot: apps/manningmetalworks
    frontend: *shared_frontend

  - appRoot: apps/oaktreelandscaping
    frontend: *shared_frontend

  - appRoot: apps/palmetto-epoxy
    frontend: *shared_frontend

  - appRoot: apps/pixelated
    frontend: *shared_frontend

  # Admin has isolated tracing and artifact cleanup because its deployment previously
  # included stale monorepo Next.js output. Keep the shared frontend anchor unchanged
  # unless another app demonstrates the same artifact problem.
  - appRoot: apps/pixelated-admin
    frontend:
      phases:
        preBuild:
          commands:
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; export REPO_ROOT;'
            - 'APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; export APP_ROOT;'
            - 'echo "Admin preBuild PWD: $(pwd)"'
            - 'echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Admin artifact app root: $APP_ROOT"'
            # Amplify can restore repository-level build output before this phase.
            - 'echo "Removing restored repository-root Next.js cache: $REPO_ROOT/.next"; rm -rf "$REPO_ROOT/.next"'
            - 'test ! -e "$REPO_ROOT/.next" || { echo "Repository-root .next remains after preBuild cleanup: $REPO_ROOT/.next"; exit 1; }'
            - 'echo "Removing all repository Next.js caches"; find "$REPO_ROOT" -type d -path "*/.next/cache" -prune -exec rm -rf {} +'
            - 'REMAINING_CACHE="$(find "$REPO_ROOT" -type d -path "*/.next/cache" -print -quit)"; test -z "$REMAINING_CACHE" || { echo "Next.js cache remains after preBuild cleanup: $REMAINING_CACHE"; exit 1; }'
            - 'for NEXT_ROOT in "$REPO_ROOT/.next" "$APP_ROOT/.next"; do for NEXT_FOLDER in cache dev diagnostics types trace trace-build; do echo "Removing preBuild Next.js directory: $NEXT_ROOT/$NEXT_FOLDER"; rm -rf "$NEXT_ROOT/$NEXT_FOLDER"; done; done'
            - 'for NEXT_ROOT in "$REPO_ROOT/.next" "$APP_ROOT/.next"; do for NEXT_FOLDER in cache dev diagnostics types trace trace-build; do test ! -e "$NEXT_ROOT/$NEXT_FOLDER" || { echo "Next.js directory remains after preBuild cleanup: $NEXT_ROOT/$NEXT_FOLDER"; exit 1; }; done; done'
            - 'echo "Installing dependencies for Admin: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'cd "$REPO_ROOT" && npm ci'
        build:
          commands:
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; export REPO_ROOT;'
            - 'APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; export APP_ROOT;'
            - 'cd "$REPO_ROOT"'
            - 'echo "Admin build PWD: $(pwd)"'
            - 'echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Admin artifact app root: $APP_ROOT"'
            - 'echo "Building shared components for Admin ..."'
            - 'npm run build -w packages/pixelated-components'
            - 'echo "Decrypting Admin config ..."; npm run config:decrypt -w "$AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Building Admin ..."'
            - 'npm run build -w "$AMPLIFY_MONOREPO_APP_ROOT"'
            - 'for NEXT_ROOT in "$REPO_ROOT/.next" "$APP_ROOT/.next"; do for NEXT_FOLDER in cache dev diagnostics types trace trace-build; do echo "Removing build Next.js directory: $NEXT_ROOT/$NEXT_FOLDER"; rm -rf "$NEXT_ROOT/$NEXT_FOLDER"; done; done'
            - 'for NEXT_ROOT in "$REPO_ROOT/.next" "$APP_ROOT/.next"; do for NEXT_FOLDER in cache dev diagnostics types trace trace-build; do test ! -e "$NEXT_ROOT/$NEXT_FOLDER" || { echo "Next.js directory remains after build cleanup: $NEXT_ROOT/$NEXT_FOLDER"; exit 1; }; done; done'
            - 'REMAINING_CACHE="$(find "$REPO_ROOT" -type d -path "*/.next/cache" -print -quit)"; test -z "$REMAINING_CACHE" || { echo "Next.js cache remains after build cleanup: $REMAINING_CACHE"; exit 1; }'
            - 'if [ -d "$REPO_ROOT/.next/cache" ]; then echo "Repository-root build recreated cache:"; du -sh "$REPO_ROOT/.next/cache"; else echo "Repository-root build produced no cache"; fi'
            - 'if [ -d "$APP_ROOT/.next/cache" ]; then echo "Admin build recreated cache:"; du -sh "$APP_ROOT/.next/cache"; else echo "Admin build produced no cache"; fi'
        postBuild:
          commands:
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; export REPO_ROOT;'
            - 'APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; export APP_ROOT;'
            - 'cd "$REPO_ROOT"'
            - 'echo "Admin postBuild PWD: $(pwd)"'
            - 'echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Admin artifact app root: $APP_ROOT"'
            - 'npm run config:postbuild -w "$AMPLIFY_MONOREPO_APP_ROOT"'
            - 'for NEXT_ROOT in "$REPO_ROOT/.next" "$APP_ROOT/.next"; do for NEXT_FOLDER in cache dev diagnostics types trace trace-build; do echo "Removing postBuild Next.js directory: $NEXT_ROOT/$NEXT_FOLDER"; rm -rf "$NEXT_ROOT/$NEXT_FOLDER"; done; done'
            - 'for NEXT_ROOT in "$REPO_ROOT/.next" "$APP_ROOT/.next"; do for NEXT_FOLDER in cache dev diagnostics types trace trace-build; do test ! -e "$NEXT_ROOT/$NEXT_FOLDER" || { echo "Next.js directory remains after postBuild cleanup: $NEXT_ROOT/$NEXT_FOLDER"; exit 1; }; done; done'
            - 'REMAINING_CACHE="$(find "$REPO_ROOT" -type d -path "*/.next/cache" -print -quit)"; test -z "$REMAINING_CACHE" || { echo "Next.js cache remains after postBuild cleanup: $REMAINING_CACHE"; exit 1; }'
            - 'echo "Repository top-level directory sizes:"; find "$REPO_ROOT" -mindepth 1 -maxdepth 1 -exec du -sb {} \;'
            - 'echo "Admin app top-level directory sizes:"; find "$APP_ROOT" -mindepth 1 -maxdepth 1 -exec du -sb {} \;'
            - 'echo "Admin .next top-level directory sizes:"; find "$APP_ROOT/.next" -mindepth 1 -maxdepth 1 -exec du -sb {} \;'
      artifacts:
        baseDirectory: .next
        files:
          - '*'
          - 'server/**/*'
          - 'static/**/*'
          - '!cache/**/*'
          - '!dev/**/*'
          - '!diagnostics/**/*'
          - '!types/**/*'

  - appRoot: packages/pixelated-components
    frontend:
      phases:
        preBuild:
          commands:
            - 'echo "preBuild PWD: $(pwd)"; echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Installing dependencies for monorepo: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'cd ../../ && npm install --force && cd "$AMPLIFY_MONOREPO_APP_ROOT"'
        build:
          commands:
            - 'echo "build PWD: $(pwd)"; echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Building shared components: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w packages/pixelated-components'
            - 'echo "Decrypting config: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run config:decrypt -w $AMPLIFY_MONOREPO_APP_ROOT'
            - 'echo "Building Next.js app: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w $AMPLIFY_MONOREPO_APP_ROOT'
            # npm run generate-site-images -w $AMPLIFY_MONOREPO_APP_ROOT
            # BUILD STORYBOOK WITH EXTRA MEMORY TO AVOID CI OOM
            - 'echo "Building Storybook with extra memory to avoid CI OOM ..."'
            - 'NODE_OPTIONS=--max-old-space-size=8192 npm run buildStorybook -w $AMPLIFY_MONOREPO_APP_ROOT'
        postBuild:
          commands:
            - 'echo "postBuild PWD: $(pwd)"; echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Calling Config Vault postbuild ..."'
            - 'npm run config:postbuild -w $AMPLIFY_MONOREPO_APP_ROOT'
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
          - '!cache/**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .next/static/**/*
          - node_modules/**/*

  - appRoot: apps/pixelvivid
    frontend: *shared_frontend

  - appRoot: apps/simple-day-concierge
    frontend: *shared_frontend

  - appRoot: apps/threemuses
    frontend: *shared_frontend