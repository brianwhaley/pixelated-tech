version: 1

applications:

  - appRoot: apps/amava-janitorial
    frontend: &shared_frontend
      phases:
        preBuild:
          commands:
            - 'echo "preBuild PWD: $(pwd)"; echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; echo "Build commit: $(git rev-parse HEAD)"; echo "amplify.yml checksum:"; sha256sum "$REPO_ROOT/amplify.yml" || true'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; echo "Pre-build resolved paths:"; for path in "$REPO_ROOT" "$APP_ROOT" "$REPO_ROOT/.next" "$APP_ROOT/.next" "$APP_ROOT/.next/cache" "$APP_ROOT/next-deploy"; do if [ -e "$path" ]; then echo "EXISTS $path"; du -sh "$path" || true; else echo "MISSING $path"; fi; done; echo "Pre-build application top-level sizes:"; du -sh "$APP_ROOT"/* || true'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; echo "Removing restored repository-root Next.js cache: $REPO_ROOT/.next"; rm -rf "$REPO_ROOT/.next"'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; echo "Removing restored standalone deployment artifact: $APP_ROOT/next-deploy"; rm -rf "$APP_ROOT/next-deploy"'
            - 'echo "Installing dependencies for monorepo: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; cd "$REPO_ROOT" && npm install --force && cd "$APP_ROOT"'
        build:
          commands:
            - 'echo "build PWD: $(pwd)"; echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Building shared components: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; cd "$REPO_ROOT" && npm run build -w packages/pixelated-components'
            - 'echo "Decrypting config: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; cd "$REPO_ROOT" && npm run config:decrypt -w "$AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Building Next.js app: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; cd "$REPO_ROOT" && npm run build -w "$AMPLIFY_MONOREPO_APP_ROOT"'
            # 'npm run generate-site-images -w $AMPLIFY_MONOREPO_APP_ROOT'
        postBuild:
          commands:
            - 'echo "postBuild PWD: $(pwd)"; echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Calling Config Vault postbuild ..."'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; cd "$REPO_ROOT" && npm run config:postbuild -w "$AMPLIFY_MONOREPO_APP_ROOT"'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; STANDALONE_APP_ROOT="$APP_ROOT/.next/standalone/$AMPLIFY_MONOREPO_APP_ROOT"; echo "Preparing standalone Next.js assets: $STANDALONE_APP_ROOT"; mkdir -p "$STANDALONE_APP_ROOT/.next"; cp -R "$APP_ROOT/.next/static" "$STANDALONE_APP_ROOT/.next/"; cp -R "$APP_ROOT/public" "$STANDALONE_APP_ROOT/public" || true'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; echo "Removing deploy-excluded Next.js cache: $APP_ROOT/.next/cache"; rm -rf "$APP_ROOT/.next/cache"'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; echo "Repository root size:"; du -sh "$REPO_ROOT" || true; echo "Repository root node_modules size:"; du -sh "$REPO_ROOT/node_modules" || true; echo "Application root size:"; du -sh "$APP_ROOT" || true; echo "Application node_modules size:"; du -sh "$APP_ROOT/node_modules" || true; echo "Application .next size:"; du -sh "$APP_ROOT/.next" || true'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; NEXT_ROOT="$APP_ROOT/.next"; echo "Resolved diagnostic paths:"; for path in "$REPO_ROOT" "$APP_ROOT" "$REPO_ROOT/node_modules" "$APP_ROOT/node_modules" "$NEXT_ROOT" "$NEXT_ROOT/static" "$NEXT_ROOT/server" "$NEXT_ROOT/standalone"; do if [ -e "$path" ]; then echo "EXISTS $path"; else echo "MISSING $path"; fi; done'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; NEXT_ROOT="$APP_ROOT/.next"; echo "Next.js directory sizes:"; for path in "$NEXT_ROOT" "$NEXT_ROOT/static" "$NEXT_ROOT/server" "$NEXT_ROOT/standalone"; do if [ -e "$path" ]; then du -sh "$path"; else echo "MISSING $path"; fi; done; echo "Next.js files larger than 10 MB:"; if [ -d "$NEXT_ROOT" ]; then find "$NEXT_ROOT" -type f -size +10M -exec du -h {} \; || true; else echo "MISSING $NEXT_ROOT"; fi'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; echo "Top-level repository directory sizes:"; cd "$REPO_ROOT" && du -sh -- * || true'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; echo "Discovered .next directories:"; find "$REPO_ROOT" -type d -name .next -prune -exec du -sh {} \; || true'
            - 'REPO_ROOT="$(git rev-parse --show-toplevel)"; APP_ROOT="$REPO_ROOT/$AMPLIFY_MONOREPO_APP_ROOT"; echo "Candidate artifact paths:"; for candidate in "$REPO_ROOT/.next" "$APP_ROOT/.next" "$APP_ROOT"; do if [ -e "$candidate" ]; then du -sh "$candidate"; else echo "MISSING $candidate"; fi; done; cd "$APP_ROOT"'
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'

  - appRoot: apps/brianwhaley
    frontend: *shared_frontend

  - appRoot: apps/informationfocus
    frontend: *shared_frontend

  - appRoot: apps/gea-construction
    frontend: *shared_frontend

  - appRoot: apps/jz-home-improvement
    frontend: *shared_frontend

  - appRoot: apps/manningmetalworks
    frontend: *shared_frontend

  - appRoot: apps/oaktreelandscaping
    frontend: *shared_frontend

  - appRoot: apps/palmetto-epoxy
    frontend: *shared_frontend

  - appRoot: apps/pixelated
    frontend: *shared_frontend

  - appRoot: apps/pixelated-admin
    frontend:
      <<: *shared_frontend
      artifacts:
        baseDirectory: .next/standalone/apps/pixelated-admin
        files:
          - '**/*'

  - appRoot: packages/pixelated-components
    frontend:
      phases:
        preBuild:
          commands:
            - 'echo "preBuild PWD: $(pwd)"; echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Installing dependencies for monorepo: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'cd ../../ && npm install --force && cd "$AMPLIFY_MONOREPO_APP_ROOT"'
        build:
          commands:
            - 'echo "build PWD: $(pwd)"; echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Building shared components: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w packages/pixelated-components'
            - 'echo "Decrypting config: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run config:decrypt -w $AMPLIFY_MONOREPO_APP_ROOT'
            - 'echo "Building Next.js app: $AMPLIFY_MONOREPO_APP_ROOT ..."'
            - 'npm run build -w $AMPLIFY_MONOREPO_APP_ROOT'
            # npm run generate-site-images -w $AMPLIFY_MONOREPO_APP_ROOT
            # BUILD STORYBOOK WITH EXTRA MEMORY TO AVOID CI OOM
            - 'echo "Building Storybook with extra memory to avoid CI OOM ..."'
            - 'NODE_OPTIONS=--max-old-space-size=8192 npm run buildStorybook -w $AMPLIFY_MONOREPO_APP_ROOT'
        postBuild:
          commands:
            - 'echo "postBuild PWD: $(pwd)"; echo "AMPLIFY_MONOREPO_APP_ROOT: $AMPLIFY_MONOREPO_APP_ROOT"'
            - 'echo "Calling Config Vault postbuild ..."'
            - 'npm run config:postbuild -w $AMPLIFY_MONOREPO_APP_ROOT'
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
          - '!cache/**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .next/static/**/*
          - node_modules/**/*

  - appRoot: apps/pixelvivid
    frontend: *shared_frontend

  - appRoot: apps/simple-day-concierge
    frontend: *shared_frontend

  - appRoot: apps/threemuses
    frontend: *shared_frontend